<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trastornos del Sueño-Vigilia</title>

  <style>
    :root{
      --bg:#000;
      --panel:#07070a;
      --text:#eaeaea;

      --blue:#00aaff;
      --blueGlow: rgba(0,170,255,.35);

      --orange:#ff7a00;
      --orangeGlow: rgba(255,122,0,.35);
    }

    *{ box-sizing: border-box; }

    body{
      margin:0;
      min-height:100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    /* Layout izquierda/derecha */
    .app{
      display:grid;
      grid-template-columns: 360px 1fr;
      min-height:100vh;
    }

    .left{
      padding:18px;
      border-right: 1px solid #111;
      background: linear-gradient(180deg, #050509, #000);
    }

    .right{
      padding:26px;
      background:
        radial-gradient(circle at 20% 10%, rgba(0,170,255,.08), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(255,122,0,.06), transparent 45%),
        var(--panel);
    }

    /* Título neón naranja LEGIBLE */
    .title{
      margin: 6px 0 18px;
      font-size: 18px;
      line-height: 1.25;
      letter-spacing: .2px;
      color: #ffd3a1;
      text-shadow:
        0 0 4px #ff9a2f,
        0 0 8px #ff7a00,
        0 0 16px rgba(255,122,0,0.7);
    }

    /* Botones neón (izquierda) */
    .btn{
      width:100%;
      text-align:left;
      padding:14px 14px;
      margin:10px 0;
      font-size:15px;
      border-radius:10px;
      cursor:pointer;

      background: rgba(0,170,255,.10);
      color: var(--text);
      border: 1px solid rgba(0,170,255,.45);

      box-shadow:
        0 0 0 1px rgba(0,170,255,.15) inset,
        0 0 18px var(--blueGlow);

      transition: transform .08s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
    }

    .btn:hover{
      transform: translateY(-1px);
      background: rgba(0,170,255,.16);
      border-color: rgba(0,170,255,.75);
      box-shadow: 0 0 26px var(--blueGlow);
    }

    .btn.active{
      background: rgba(255,122,0,.14);
      border-color: rgba(255,122,0,.75);
      box-shadow: 0 0 26px var(--orangeGlow);
      color:#fff;
    }

    /* Tarjeta derecha */
    .card{
      max-width: 950px;
      margin: 0 auto;
      padding: 22px;
      border: 1px solid #151515;
      border-radius: 14px;
      background: rgba(255,255,255,.03);
    }

    .card h2{
      margin: 0 0 10px;
      font-size: 24px;
      color: #dcdcdc;
    }

    .hint{
      margin-top: 8px;
      opacity: .85;
      font-size: 13px;
    }

    .opciones{
      display:flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 14px;
    }

    /* Botones de opciones (derecha) */
    .opt{
      text-align:left;
      padding:14px;
      border-radius:10px;
      border: 1px solid rgba(0,170,255,.45);
      background: rgba(0,170,255,.08);
      color: var(--text);
      cursor:pointer;
      box-shadow: 0 0 14px var(--blueGlow);
      transition: .15s ease;
    }

    .opt:hover{
      border-color: rgba(0,170,255,.8);
      background: rgba(0,170,255,.14);
    }

    /* Panel de detalle */
    .detail{
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #1a1a1a;
      background: rgba(0,0,0,.35);
      display:none;
      line-height: 1.5;
      color: #d7d7d7;
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- IZQUIERDA -->
    <aside class="left">
      <div class="title">Trastornos del Sueño–Vigilia</div>

      <!-- Categorías -->
      <button class="btn" onclick="cargar('insomnio', this)">Insomnio</button>
      <button class="btn" onclick="cargar('hipersomnia', this)">Hipersomnia</button>
      <button class="btn" onclick="cargar('ritmo', this)">Ritmo circadiano</button>
      <button class="btn" onclick="cargar('parasomnias', this)">Parasomnias</button>
    </aside>

    <!-- DERECHA -->
    <main class="right">
      <div class="card">
        <h2 id="tituloDerecha">Seleccione una categoría</h2>
        <div class="hint" id="descripcion">
          Al presionar un botón a la izquierda, aquí aparecerán nuevas opciones (sin cambiar de archivo).
        </div>

        <div class="opciones" id="listaOpciones"></div>
        <div class="detail" id="detalle"></div>
      </div>
    </main>
  </div>

  <script>
    const data = {
      insomnio: {
        titulo: "Insomnio",
        desc: "Seleccione un apartado para ver el contenido aquí mismo.",
        opciones: [
          { t: "Descripción", d: "Dificultad persistente para iniciar o mantener el sueño, o despertar precoz." },
          { t: "Tipos", d: "De inicio, de mantenimiento o despertar temprano; agudo o crónico." },
          { t: "Factores asociados", d: "Estrés, hábitos de sueño, uso de pantallas, cafeína, cambios de rutina, etc." },
          { t: "Orientación", d: "Higiene del sueño, rutinas consistentes y apoyo profesional si afecta la vida diaria." }
        ]
      },
      hipersomnia: {
        titulo: "Hipersomnia",
        desc: "Seleccione un apartado para ver el contenido aquí mismo.",
        opciones: [
          { t: "Descripción", d: "Somnolencia excesiva diurna pese a dormir muchas horas." },
          { t: "Señales", d: "Dificultad para despertar, sueño no reparador, siestas prolongadas." },
          { t: "Posibles causas", d: "Privación de sueño, trastornos respiratorios del sueño, medicamentos u otras condiciones." },
          { t: "Orientación", d: "Revisar hábitos y consultar si es persistente o interfiere con actividades." }
        ]
      },
      ritmo: {
        titulo: "Trastornos del Ritmo Circadiano",
        desc: "Seleccione un apartado para ver el contenido aquí mismo.",
        opciones: [
          { t: "Retraso de fase", d: "Dormir y despertar mucho más tarde de lo deseado (frecuente en adolescentes)." },
          { t: "Adelanto de fase", d: "Somnolencia temprana y despertar muy temprano." },
          { t: "Jet lag / turnos", d: "Desajuste por viajes o trabajo por turnos; afecta sueño y rendimiento." },
          { t: "Orientación", d: "Luz natural, rutinas, manejo de horarios; apoyo profesional si persiste." }
        ]
      },
      parasomnias: {
        titulo: "Parasomnias",
        desc: "Seleccione un apartado para ver el contenido aquí mismo.",
        opciones: [
          { t: "Descripción", d: "Conductas o experiencias anormales durante el sueño (p. ej., sonambulismo)." },
          { t: "Ejemplos", d: "Terrores nocturnos, pesadillas, sonambulismo." },
          { t: "Factores asociados", d: "Estrés, falta de sueño, fiebre, algunos fármacos." },
          { t: "Orientación", d: "Seguridad del entorno y consulta si hay riesgo o episodios frecuentes." }
        ]
      }
    };

    function activarBoton(btn){
      document.querySelectorAll(".btn").forEach(b => b.classList.remove("active"));
      if(btn) btn.classList.add("active");
    }

    function cargar(clave, btn){
      activarBoton(btn);

      const info = data[clave];
      document.getElementById("tituloDerecha").textContent = info.titulo;
      document.getElementById("descripcion").textContent = info.desc;

      const cont = document.getElementById("listaOpciones");
      cont.innerHTML = "";

      const det = document.getElementById("detalle");
      det.style.display = "none";
      det.textContent = "";

      info.opciones.forEach(item => {
        const b = document.createElement("button");
        b.className = "opt";
        b.textContent = item.t;

        b.onclick = () => {
          det.style.display = "block";
          det.innerHTML = "<strong>" + item.t + ":</strong><br><br>" + item.d;
        };

        cont.appendChild(b);
      });
    }
  </script>
</body>
</html>
