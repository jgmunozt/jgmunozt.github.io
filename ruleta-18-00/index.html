<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ruleta de opciones | 18:00</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at top,#303256,#10121f 75%);color:white;font:16px system-ui,-apple-system,sans-serif;padding:16px}.card{max-width:470px;width:100%;text-align:center;border:1px solid #ffffff26;border-radius:25px;padding:25px 18px 30px;background:#ffffff0c;box-shadow:0 18px 50px #0005}h1{margin:0 0 7px;font-size:30px}.muted{color:#bdc1d5}.timer{font-size:clamp(36px,11vw,52px);font-weight:800;font-variant-numeric:tabular-nums;margin:14px 0}.wrap{position:relative;width:min(75vw,320px);aspect-ratio:1;border-radius:50%;padding:9px;background:linear-gradient(130deg,#ffe8aa,#ba8126);margin:26px auto}.wheel{width:100%;height:100%;border-radius:50%;border:3px solid #fffc;position:relative;overflow:hidden;background:conic-gradient(from -90deg,#16a69d 0 180deg,#7861dc 180deg 360deg)}.name{position:absolute;left:0;width:100%;font-size:clamp(18px,6vw,25px);font-weight:800;text-shadow:0 2px 6px #0007}.one{top:22%}.two{bottom:22%}.pointer{position:absolute;z-index:4;top:-12px;left:50%;transform:translateX(-50%);border-left:18px solid transparent;border-right:18px solid transparent;border-top:36px solid #ffe29a;filter:drop-shadow(0 3px 3px #0008)}.hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;width:48px;height:48px;background:white;border:8px solid #efba55;box-shadow:0 2px 8px #0005}button{width:100%;max-width:300px;padding:15px;border:0;border-radius:14px;background:#ffd175;color:#292333;font-size:18px;font-weight:800;cursor:pointer}button:disabled{opacity:.55}.result{font-size:23px;font-weight:800;min-height:37px;margin:15px 0}.note{font-size:12px;color:#b7b8cb;margin-top:22px}.hidden{display:none}
</style></head><body><main class="card"><h1>🎡 Ruleta de opciones</h1><p class="muted" id="subtitle">Revelación: 8 de noviembre, 18:00 (Chile)</p><section id="waiting"><p>La revelación comienza en</p><div class="timer" id="count">--:--:--</div><p class="muted">Domingo 8 de noviembre de 2026</p></section><section id="game" class="hidden"><div class="wrap"><div class="pointer"></div><div class="wheel" id="wheel"><div class="name one">OPCIÓN 1</div><div class="name two">OPCIÓN 2</div></div><div class="hub"></div></div><div class="result" id="result">¡Lista para girar!</div></section><p class="note">8 de noviembre de 2026</p></main><script>
(()=> {
 const start=Date.parse('2026-11-08T18:00:00-03:00'), end=start+5500;
 const waiting=document.getElementById('waiting'),game=document.getElementById('game'),count=document.getElementById('count'),wheel=document.getElementById('wheel'),result=document.getElementById('result');
 let mode='';
 function showResult(){
  mode='done';waiting.classList.add('hidden');game.classList.remove('hidden');
  wheel.style.transition='none';wheel.style.transform='rotate(2168deg)';
  result.textContent='🎉 ¡Ganó OPCIÓN 1!';
 }
 function startSpin(){
  mode='spinning';waiting.classList.add('hidden');game.classList.remove('hidden');
  wheel.style.transition='none';wheel.style.transform='rotate(0deg)';
  result.textContent='🎡 Girando…';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{wheel.style.transition='transform 5s cubic-bezier(.12,.72,.12,1)';wheel.style.transform='rotate(2168deg)'}));
 }
 function tick(){
  const now=Date.now();
  if(now>=end){if(mode!=='done')showResult();return;}
  if(now>=start){if(mode==='')startSpin();return;}
  const t=Math.ceil((start-now)/1000);
  count.textContent=[Math.floor(t/3600),Math.floor(t%3600/60),t%60].map(v=>String(v).padStart(2,'0')).join(':');
 }
 tick();setInterval(tick,250);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
})();
</script></body></html>
