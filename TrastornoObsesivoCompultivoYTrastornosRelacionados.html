<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trastorno Obsesivo-Compulsivo y Trastornos Relacionados</title>

  <style>
    :root{
      --bg:#000;
      --panel:#07070a;
      --text:#eaeaea;

      --blue:#00aaff;
      --blueGlow: rgba(0,170,255,.35);

      --orange:#ff7a00;
      --orangeGlow: rgba(255,122,0,.35);
    }

    *{ box-sizing: border-box; }

    body{
      margin:0;
      min-height:100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    /* Layout izquierda/derecha */
    .app{
      display:grid;
      grid-template-columns: 360px 1fr;
      min-height:100vh;
    }

    .left{
      padding:18px;
      border-right: 1px solid #111;
      background: linear-gradient(180deg, #050509, #000);
    }

    .right{
      padding:26px;
      background:
        radial-gradient(circle at 20% 10%, rgba(0,170,255,.08), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(255,122,0,.06), transparent 45%),
        var(--panel);
    }

    /* Título neón naranja LEGIBLE */
    .title{
      margin: 6px 0 18px;
      font-size: 18px;
      line-height: 1.25;
      letter-spacing: .2px;
      color: #ffd3a1;
      text-shadow:
        0 0 4px #ff9a2f,
        0 0 8px #ff7a00,
        0 0 16px rgba(255,122,0,0.7);
    }

    /* Botones neón (izquierda) */
    .btn{
      width:100%;
      text-align:left;
      padding:14px 14px;
      margin:10px 0;
      font-size:15px;
      border-radius:10px;
      cursor:pointer;

      background: rgba(0,170,255,.10);
      color: var(--text);
      border: 1px solid rgba(0,170,255,.45);

      box-shadow:
        0 0 0 1px rgba(0,170,255,.15) inset,
        0 0 18px var(--blueGlow);

      transition: transform .08s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
    }

    .btn:hover{
      transform: translateY(-1px);
      background: rgba(0,170,255,.16);
      border-color: rgba(0,170,255,.75);
      box-shadow: 0 0 26px var(--blueGlow);
    }

    .btn.active{
      background: rgba(255,122,0,.14);
      border-color: rgba(255,122,0,.75);
      box-shadow: 0 0 26px var(--orangeGlow);
      color:#fff;
    }

    /* Tarjeta derecha */
    .card{
      max-width: 950px;
      margin: 0 auto;
      padding: 22px;
      border: 1px solid #151515;
      border-radius: 14px;
      background: rgba(255,255,255,.03);
    }

    .card h2{
      margin: 0 0 10px;
      font-size: 24px;
      color: #dcdcdc;
    }

    .hint{
      margin-top: 8px;
      opacity: .85;
      font-size: 13px;
    }

    .opciones{
      display:flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 14px;
    }

    /* Botones de opciones (derecha) */
    .opt{
      text-align:left;
      padding:14px;
      border-radius:10px;
      border: 1px solid rgba(0,170,255,.45);
      background: rgba(0,170,255,.08);
      color: var(--text);
      cursor:pointer;
      box-shadow: 0 0 14px var(--blueGlow);
      transition: .15s ease;
    }

    .opt:hover{
      border-color: rgba(0,170,255,.8);
      background: rgba(0,170,255,.14);
    }

    /* Panel de detalle */
    .detail{
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #1a1a1a;
      background: rgba(0,0,0,.35);
      display:none;
      line-height: 1.5;
      color: #d7d7d7;
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- IZQUIERDA -->
    <aside class="left">
      <div class="title">Trastorno Obsesivo-Compulsivo y Trastornos Relacionados</div>

      <!-- Categorías (ejemplos) -->
      <button class="btn" onclick="cargar('toc', this)">TOC (Trastorno obsesivo-compulsivo)</button>
      <button class="btn" onclick="cargar('dismorfico', this)">Trastorno dismórfico corporal</button>
      <button class="btn" onclick="cargar('acumulacion', this)">Trastorno de acumulación</button>
      <button class="btn" onclick="cargar('tricotilomania', this)">Tricotilomanía / Excoriación</button>
    </aside>

    <!-- DERECHA -->
    <main class="right">
      <div class="card">
        <h2 id="tituloDerecha">Seleccione una categoría</h2>
        <div class="hint" id="descripcion">
          Al presionar un botón a la izquierda, aquí aparecerán nuevas opciones (sin cambiar de archivo).
        </div>

        <div class="opciones" id="listaOpciones"></div>
        <div class="detail" id="detalle"></div>
      </div>
    </main>
  </div>

  <script>
    const data = {
      toc: {
        titulo: "TOC (Trastorno obsesivo-compulsivo)",
        desc: "Seleccione un apartado para ver el contenido aquí mismo.",
        opciones: [
          { t: "Características principales", d: "Presencia de obsesiones (pensamientos intrusivos) y/o compulsiones (conductas repetitivas) que generan malestar." },
          { t: "Ejemplos frecuentes", d: "Comprobación, lavado, orden/simetría, conteo o rituales mentales." },
          { t: "Señales de alerta", d: "Tiempo excesivo en rituales, evitación, interferencia en vida diaria." },
          { t: "Apoyo y derivación", d: "Evaluación profesional; intervenciones psicológicas y apoyo según necesidad." }
        ]
      },
      dismorfico: {
        titulo: "Trastorno dismórfico corporal",
        desc: "Seleccione un apartado para ver el contenido aquí mismo.",
        opciones: [
          { t: "Características principales", d: "Preocupación intensa por defectos percibidos en la apariencia, con conductas repetitivas (mirarse, comparar, camuflar)." },
          { t: "Impacto", d: "Afecta autoestima, relaciones y actividades; puede generar evitación social." },
          { t: "Señales de alerta", d: "Tiempo excesivo pensando en apariencia, chequeos repetidos o búsqueda constante de confirmación." },
          { t: "Apoyo y derivación", d: "Orientación profesional para evaluación y estrategias de afrontamiento." }
        ]
      },
      acumulacion: {
        titulo: "Trastorno de acumulación",
        desc: "Seleccione un apartado para ver el contenido aquí mismo.",
        opciones: [
          { t: "Características principales", d: "Dificultad persistente para desechar objetos, acumulación que congestiona espacios." },
          { t: "Motivos comunes", d: "Valor sentimental, miedo a necesitarlo después, ansiedad al desechar." },
          { t: "Señales de alerta", d: "Espacios inutilizables, conflictos familiares, riesgos de seguridad/higiene." },
          { t: "Apoyo y derivación", d: "Plan gradual y acompañamiento profesional para reducir ansiedad y organizar." }
        ]
      },
      tricotilomania: {
        titulo: "Tricotilomanía / Excoriación",
        desc: "Seleccione un apartado para ver el contenido aquí mismo.",
        opciones: [
          { t: "Tricotilomanía", d: "Arrancarse el cabello de forma recurrente, con dificultad para detenerse y malestar asociado." },
          { t: "Excoriación", d: "Rascado/pellizcado de la piel de forma repetitiva, con lesiones y malestar." },
          { t: "Desencadenantes", d: "Estrés, ansiedad, aburrimiento; a veces ocurre de forma automática." },
          { t: "Apoyo y derivación", d: "Estrategias conductuales y apoyo profesional según impacto." }
        ]
      }
    };

    function activarBoton(btn){
      document.querySelectorAll(".btn").forEach(b => b.classList.remove("active"));
      if(btn) btn.classList.add("active");
    }

    function cargar(clave, btn){
      activarBoton(btn);

      const info = data[clave];
      document.getElementById("tituloDerecha").textContent = info.titulo;
      document.getElementById("descripcion").textContent = info.desc;

      const cont = document.getElementById("listaOpciones");
      cont.innerHTML = "";

      const det = document.getElementById("detalle");
      det.style.display = "none";
      det.textContent = "";

      info.opciones.forEach(item => {
        const b = document.createElement("button");
        b.className = "opt";
        b.textContent = item.t;

        b.onclick = () => {
          det.style.display = "block";
          det.innerHTML = "<strong>" + item.t + ":</strong><br><br>" + item.d;
        };

        cont.appendChild(b);
      });
    }
  </script>
</body>
</html>
