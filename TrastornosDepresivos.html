<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trastornos Depresivos</title>

  <style>
    :root{
      --bg:#000;
      --panel:#07070a;
      --text:#eaeaea;
      --blue:#00aaff;
      --blueGlow: rgba(0,170,255,.35);
      --orange:#ff7a00;
      --orangeGlow: rgba(255,122,0,.35);
    }

    *{ box-sizing: border-box; }

    body{
      margin:0;
      min-height:100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .app{
      display:grid;
      grid-template-columns: 360px 1fr;
      min-height:100vh;
    }

    .left{
      padding:18px;
      border-right:1px solid #111;
      background: linear-gradient(180deg, #050509, #000);
    }

    .right{
      padding:26px;
      background:
        radial-gradient(circle at 20% 10%, rgba(0,170,255,.08), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(255,122,0,.06), transparent 45%),
        var(--panel);
    }

    .title{
      margin: 6px 0 18px;
      font-size: 18px;
      line-height: 1.25;
      color: #ffd3a1;
      text-shadow: 0 0 4px #ff9a2f, 0 0 8px #ff7a00, 0 0 16px rgba(255,122,0,.7);
    }

    .btn{
      width:100%;
      text-align:left;
      padding:14px;
      margin:10px 0;
      font-size:15px;
      border-radius:10px;
      cursor:pointer;
      background: rgba(0,170,255,.10);
      color: var(--text);
      border:1px solid rgba(0,170,255,.45);
      box-shadow: 0 0 0 1px rgba(0,170,255,.15) inset, 0 0 18px var(--blueGlow);
      transition:.15s ease;
    }

    .btn:hover{
      background: rgba(0,170,255,.16);
      border-color: rgba(0,170,255,.75);
      box-shadow: 0 0 26px var(--blueGlow);
      transform: translateY(-1px);
    }

    .btn.active{
      background: rgba(255,122,0,.14);
      border-color: rgba(255,122,0,.75);
      box-shadow: 0 0 26px var(--orangeGlow);
      color:#fff;
    }

    .card{
      max-width: 950px;
      margin: 0 auto;
      padding: 22px;
      border: 1px solid #151515;
      border-radius: 14px;
      background: rgba(255,255,255,.03);
    }

    .card h2{
      margin: 0 0 10px;
      font-size: 24px;
      color: #dcdcdc;
    }

    .hint{
      opacity:.85;
      font-size:13px;
    }

    .opciones{
      display:flex;
      flex-direction: column;
      gap:12px;
      margin-top:14px;
    }

    .opt{
      text-align:left;
      padding:14px;
      border-radius:10px;
      border:1px solid rgba(0,170,255,.45);
      background: rgba(0,170,255,.08);
      color: var(--text);
      cursor:pointer;
      box-shadow: 0 0 14px var(--blueGlow);
      transition:.15s ease;
    }

    .opt:hover{
      border-color: rgba(0,170,255,.8);
      background: rgba(0,170,255,.14);
    }

    .detail{
      margin-top:16px;
      padding:14px;
      border-radius:12px;
      border:1px solid #1a1a1a;
      background: rgba(0,0,0,.35);
      display:none;
      line-height:1.5;
      color:#d7d7d7;
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- IZQUIERDA -->
    <aside class="left">
      <div class="title">Trastornos Depresivos</div>

      <button class="btn" onclick="cargar('mayor', this)">Trastorno depresivo mayor</button>
      <button class="btn" onclick="cargar('distimia', this)">Trastorno depresivo persistente</button>
      <button class="btn" onclick="cargar('premenstrual', this)">Trastorno disfórico premenstrual</button>
      <button class="btn" onclick="cargar('otros', this)">Otros trastornos depresivos</button>
    </aside>

    <!-- DERECHA -->
    <main class="right">
      <div class="card">
        <h2 id="tituloDerecha">Elija una opción</h2>
        <p class="hint" id="descripcion">
          Seleccione una categoría desde el menú izquierdo para continuar.
        </p>

        <div class="opciones" id="listaOpciones"></div>
        <div class="detail" id="detalle"></div>
      </div>
    </main>
  </div>

  <script>
    const data = {
      mayor: {
        titulo: "Trastorno depresivo mayor",
        desc: "Seleccione un apartado para ver el contenido.",
        opciones: [
          { t: "Características principales", d: "Ánimo deprimido, anhedonia, alteraciones del sueño y apetito." },
          { t: "Señales de alerta", d: "Aislamiento, desesperanza persistente, dificultad funcional." },
          { t: "Curso", d: "Episódico, con posible recurrencia." },
          { t: "Orientación", d: "Evaluación profesional temprana mejora el pronóstico." }
        ]
      },
      distimia: {
        titulo: "Trastorno depresivo persistente",
        desc: "Seleccione un apartado para ver el contenido.",
        opciones: [
          { t: "Características principales", d: "Ánimo deprimido crónico de menor intensidad." },
          { t: "Duración", d: "≥ 2 años en adultos (≥ 1 año en niños/adolescentes)." },
          { t: "Impacto", d: "Afecta motivación, autoestima y relaciones." },
          { t: "Orientación", d: "Seguimiento psicológico continuo." }
        ]
      },
      premenstrual: {
        titulo: "Trastorno disfórico premenstrual",
        desc: "Seleccione un apartado para ver el contenido.",
        opciones: [
          { t: "Características", d: "Síntomas emocionales intensos previos a la menstruación." },
          { t: "Síntomas frecuentes", d: "Irritabilidad, tristeza, ansiedad." },
          { t: "Curso", d: "Remisión posterior al inicio del ciclo." }
        ]
      },
      otros: {
        titulo: "Otros trastornos depresivos",
        desc: "Seleccione un apartado para ver el contenido.",
        opciones: [
          { t: "Inducido por sustancias", d: "Relacionado con consumo o suspensión." },
          { t: "Debido a condición médica", d: "Asociado a enfermedades médicas." }
        ]
      }
    };

    function activarBoton(btn){
      document.querySelectorAll(".btn").forEach(b => b.classList.remove("active"));
      if(btn) btn.classList.add("active");
    }

    function cargar(clave, btn){
      activarBoton(btn);

      const info = data[clave];
      document.getElementById("tituloDerecha").textContent = info.titulo;
      document.getElementById("descripcion").textContent = info.desc;

      const cont = document.getElementById("listaOpciones");
      cont.innerHTML = "";

      const det = document.getElementById("detalle");
      det.style.display = "none";
      det.textContent = "";

      info.opciones.forEach(item => {
        const b = document.createElement("button");
        b.className = "opt";
        b.textContent = item.t;
        b.onclick = () => {
          det.style.display = "block";
          det.innerHTML = "<strong>" + item.t + ":</strong><br><br>" + item.d;
        };
        cont.appendChild(b);
      });
    }
  </script>
</body>
</html>
